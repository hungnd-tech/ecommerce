server:
  port: 8080

spring:
  application:
    name: ecommerce

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ecommerce
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    # open-in-view: false đánh đổi "tiện lợi ban đầu" lấy "kiểm soát chặt + phát hiện lỗi sớm"
    # mặc định là true: session được mở ra ngay khi request HTTP bắt đầu, giữ connect DB suốt quá trình
    # false: session chỉ sống đúng trong phạm vi 1 @Transactional đang active, lazy loading ném lõi ngay
    # lazy loading là chỉ khi cần mới gọi đến
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mvc:
    problemdetails:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 giờ, tính bằng milliseconds

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

