server:
  port: 8080

spring:
  application:
    name: ecommerce

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mvc:
    problemdetails:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 giờ, tính bằng milliseconds